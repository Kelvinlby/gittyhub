[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
sourceview = { package = "sourceview5", version = "0.11", features = ["v5_10"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

git-backend = { path = "crates/git-backend" }
gh-backend = { path = "crates/gh-backend" }

[profile.release]
lto = "thin"
strip = true
