[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Pre-1.0: pin exact versions and upgrade deliberately.
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12" }
gpui-component = "=0.9.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

git-backend = { path = "crates/git-backend" }
gh-backend = { path = "crates/gh-backend" }

[profile.release]
lto = "thin"
strip = true
